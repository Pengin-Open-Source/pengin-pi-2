{% extends "layout/fullPageScroll.html" %}

{% block pageDropDowns %}
    <a href="{% url "calendar:calendar" %}">Cancel</a>
{% endblock %}

{% block pageContent %}

        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary-button" type="submit">Set Calendar Week</button>
    </form>
{% endblock %}
