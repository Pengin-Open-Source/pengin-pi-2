{% extends "layout/fullPageScroll.html" %}


{% block pageContent %}
{% if messages %}
<div class="alert alert-danger center-title">
    {% for message in messages %}
        {{ message }}.
    {% endfor %}
</div>
{% endif %}
    <form class="form" method="POST" action="{% url 'create_company' %}">
        {% csrf_token %}
        {{ form }}
        <button class="primary-button" type="submit">Create Company</button>
    </form>
{% endblock %}
